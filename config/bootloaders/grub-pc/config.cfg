# PolarisOS — GRUB base configuration (graphics, font and timeout)
set default=0
set timeout=10
set timeout_style=menu

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    if [ "${grub_platform}" = "efi" ]; then
        insmod efi_gop
    fi
    # Módulos de video que solo existen en PC (x86)
    if [ "${grub_cpu}" = "x86_64" -o "${grub_cpu}" = "i386" ]; then
        if [ "${grub_platform}" = "efi" ]; then
            insmod efi_uga
        fi
        insmod video_bochs
        insmod video_cirrus
    fi
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

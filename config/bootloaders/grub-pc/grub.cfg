# =============================================================================
# PolarisOS — boot menu (GRUB, same menu for BIOS and UEFI)
#
# live-build replaces the placeholders between at-signs when building the
# ISO (kernel, initrd and the parameters from --bootappend-live).
# Do not write live-build's legacy placeholder names in comments: live-build
# would replace them here too.
# =============================================================================
source /boot/grub/config.cfg

menuentry "Start PolarisOS" --hotkey=s --id=live {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Start PolarisOS (safe graphics)" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

menuentry "Start PolarisOS (load to RAM)" --hotkey=r {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ toram
	initrd	@INITRD_LIVE@
}

menuentry "Start PolarisOS (persistent storage)" --hotkey=p {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ persistence
	initrd	@INITRD_LIVE@
}

if @ENABLE_VERIFY_CHECKSUMS@; then
	menuentry "Check disc for defects" --hotkey=c {
		linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
		initrd	@INITRD_LIVE@
	}
fi

submenu "Languages ..." --hotkey=l {
	source /boot/grub/theme.cfg

	menuentry "English (United States)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@
		initrd	@INITRD_LIVE@
	}
	menuentry "Español (Latinoamérica)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=es_MX.UTF-8 keyboard-layouts=latam
		initrd	@INITRD_LIVE@
	}
	menuentry "Español (España)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=es_ES.UTF-8 keyboard-layouts=es
		initrd	@INITRD_LIVE@
	}
	menuentry "Português (Brasil)" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=pt_BR.UTF-8 keyboard-layouts=br
		initrd	@INITRD_LIVE@
	}
	menuentry "Français" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=fr_FR.UTF-8 keyboard-layouts=fr
		initrd	@INITRD_LIVE@
	}
	menuentry "Deutsch" {
		linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=de_DE.UTF-8 keyboard-layouts=de
		initrd	@INITRD_LIVE@
	}
}

submenu "Advanced options ..." --hotkey=a {
	source /boot/grub/theme.cfg

	menuentry "Start PolarisOS (compatibility mode)" {
		linux	@KERNEL_LIVE@ @LB_BOOTAPPEND_LIVE_FAILSAFE@ findiso=${iso_path}
		initrd	@INITRD_LIVE@
	}

	if @ENABLE_MEMTEST@; then
		source /boot/grub/memtest.cfg
	fi

	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
		menuentry "Boot from next device" --hotkey=n {
			exit 1
		}
	fi

	menuentry "Reboot" --hotkey=b {
		reboot
	}
	menuentry "Power off" --hotkey=o {
		halt
	}
}

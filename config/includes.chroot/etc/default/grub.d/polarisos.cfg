# PolarisOS — show the boot splash (Plymouth) on the installed system.
# Appends "splash" only if the installer did not add it already, and keeps any
# other option the installer wrote (resume, encrypted disk, etc.).
case " ${GRUB_CMDLINE_LINUX_DEFAULT} " in
	*" splash "*) ;;
	*) GRUB_CMDLINE_LINUX_DEFAULT="${GRUB_CMDLINE_LINUX_DEFAULT} splash" ;;
esac

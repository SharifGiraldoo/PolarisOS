# PolarisOS — privacidad en redes
#
# - Al buscar redes Wi-Fi se usa una dirección MAC aleatoria.
# - Al conectarse, cada red Wi-Fi ve una MAC distinta pero estable: las redes
#   no pueden seguirte de un lugar a otro, y los portales cautivos (hoteles,
#   universidades) siguen reconociéndote.
# - IPv6 usa direcciones temporales de privacidad.
[device]
wifi.scan-rand-mac-address=yes

[connection]
wifi.cloned-mac-address=stable
ipv6.ip6-privacy=2
